sonar.projectKey=chesslab
sonar.projectName=chesslab
sonar.projectVersion=0.1.0

sonar.sources=src,src/chesslab/web/frontend/src
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=

sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.lcov.reportPaths=

sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/.venv/**,**/data/**,**/scans/**,**/synth_pieces/**,**/specs/**,**/tmp/**,**/wheels/**,**/*.glb,**/*.obj,**/*.png,**/*.jpg,**/*.jpeg,**/*.blend

# Static build output (served by FastAPI)
sonar.javascript.exclusions=**/web/static/**,**/dist/**
sonar.coverage.exclusions=**/tests/**,**/tmp/**

# Encoding
sonar.sourceEncoding=UTF-8
