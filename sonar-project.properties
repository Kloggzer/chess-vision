# SonarCloud, Organisation `kloggzer` — 50 000 ncloc sind das Kontingent, das ganze Repo traegt
# rund 141 600. Analysiert wird deshalb NICHT alles, sondern der Teil, in dem ein Fehler wehtut:
# der Weg aufs Geraet plus der Datenkern. `docs/quality-tooling.md` nennt die Zahlen und was fehlt.
sonar.projectKey=CHANGEME
sonar.organization=kloggzer
sonar.projectName=chesslab
sonar.sourceEncoding=UTF-8

# Der Gerätepfad ist die Wahrheit (`kotlin-is-the-reference-implementation`), `src/chesslab` baut
# die Daten, `lib/` traegt die JSONL- und Schreib-Vertraege der Web-App.
sonar.sources=\
  android/core-engine/src/main,\
  android/core-geometry/src/main,\
  android/core-cnn/src/main,\
  android/tracker-runtime/src/main,\
  android/arena/src/main,\
  src/chesslab,\
  platform/app/lib,\
  platform/app/app/api

# Tests zaehlen als Tests, nicht als Quellen — Sonar bewertet sie ohnehin anders.
sonar.tests=\
  tests,\
  android/core-engine/src/test,\
  android/core-geometry/src/test,\
  android/core-cnn/src/test,\
  android/tracker-runtime/src/test,\
  android/arena/src/test
sonar.test.inclusions=**/*Test.kt,**/*.test.ts,**/*.test.tsx,**/test_*.py

# Bewusst DRAUSSEN, mit Grund:
#   android/app          Compose-Huelle; die Logik sitzt in tracker-runtime und core-engine
#   android/desktop      Replay-Werkzeug, geht nie aufs Geraet
#   platform/app/app/*   Next-Seiten ausser den API-Routen; UI, kein Vertrag
#   scripts/, synth/     Messwerkzeug und Renderer, einmal benutzt statt ausgeliefert
sonar.exclusions=\
  **/build/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  platform/app/lib/**/*.test.ts,\
  platform/app/lib/**/*.test.tsx
