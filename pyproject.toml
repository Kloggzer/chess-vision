[project]
name = "chesslab"
version = "0.1.0"
description = "Auto-labeled chess piece dataset builder (per-square 13-class classification)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "typer>=0.12",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "python-chess>=1.10",
    "pyyaml>=6.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    # Windows-ROCm-Trainingsstack: auf lokale Wheels (wheels/) gepinnt, damit `uv sync`
    # sie NICHT entfernt, sondern aus den Wheels neu installiert. Auf Linux/macOS per
    # Marker ausgeschlossen (Rig nutzt seine eigene ROCm-Umgebung).
    "torch==2.9.1+rocm7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "torchvision==0.24.1+rocm7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-core==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-devel==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-libraries-custom==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "open3d>=0.19.0",
    "pymeshlab>=2025.7.post1",
    "trimesh>=4.12.2",
    "python-multipart>=0.0.32",
    # imported directly (web/schemas.py), otherwise only transitive via fastapi
    "pydantic>=2.0",
]
# Optional (lazy, with fallback): matplotlib (meshprep preview), pyperclip (UI clipboard)

[project.urls]
Repository = "https://github.com/Kloggzer/chess-vision"

[tool.uv.sources]
torch = { path = "wheels/torch-2.9.1+rocm7.2.1-cp312-cp312-win_amd64.whl" }
torchvision = { path = "wheels/torchvision-0.24.1+rocm7.2.1-cp312-cp312-win_amd64.whl" }
"rocm-sdk-core" = { path = "wheels/rocm_sdk_core-7.2.1-py3-none-win_amd64.whl" }
"rocm-sdk-devel" = { path = "wheels/rocm_sdk_devel-7.2.1-py3-none-win_amd64.whl" }
"rocm-sdk-libraries-custom" = { path = "wheels/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl" }
rocm = { path = "wheels/rocm-7.2.1.tar.gz" }

[project.scripts]
chesslab = "chesslab.cli:main"

# uv-native dev dependencies (PEP 735). Installed by default on `uv sync`,
# excluded from the published package. Use `uv sync --no-dev` for a runtime-only env.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.15.20",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "clips: Replay-Tests gegen lokale Videoclips in data/testclips (skip wenn nicht vorhanden)",
]
addopts = "-m 'not clips'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "synth"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "B904",   # raise-without-from-inside-except — noisy in existing code
    "E501",   # line-too-long — Formatter/Stil-Sache, kein Bug (405 Treffer)
    "E702",   # multiple-statements-semicolon — bewusster Kompakt-Stil im Repo
]

[tool.ruff.lint.per-file-ignores]
# Synth files import bpy (unresolved external) + Blender-Globals
"synth/**" = ["F403", "F405", "F821"]
# FastAPI: Body(...)/File(...)/Depends(...) in Default-Argumenten ist gewollt
"src/chesslab/web/**" = ["B008"]

[tool.ruff.format]
# Black-compatible line-ending style
quote-style = "double"
