[project]
name = "chesslab"
version = "0.2.0"
description = "Auto-labeled chess piece dataset builder (per-square 13-class classification)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "typer>=0.12",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "python-chess>=1.10",
    "pyyaml>=6.0",
    # Windows-ROCm-Trainingsstack: auf lokale Wheels (wheels/) gepinnt, damit `uv sync`
    # sie NICHT entfernt, sondern aus den Wheels neu installiert. Auf Linux/macOS per
    # Marker ausgeschlossen (Rig nutzt seine eigene ROCm-Umgebung).
    "torch==2.9.1+rocm7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "torchvision==0.24.1+rocm7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-core==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-devel==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-libraries-custom==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm==7.2.1 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "open3d>=0.19.0",
    "pymeshlab>=2025.7.post1",
    "trimesh>=4.12.2",
    "timm>=1.0.27",
    "pyturbojpeg>=2.4.0",
    "onnxruntime>=1.27.0",
    "onnxscript>=0.7.1",
    "simplejpeg>=1.9.0",
    # The frame scan's person sensor (RT-DETR) and the occluder mattes (SAM 3) both load through
    # it; before 2026-08-18 it was an undeclared `uv run --with` that the export now cannot skip.
    "transformers>=4.57.0",
]
# Optional (lazy, with fallback): matplotlib (meshprep preview), pyperclip (UI clipboard)

[project.urls]
Repository = "https://github.com/Kloggzer/chess-vision"

[tool.uv.sources]
torch = { path = "wheels/torch-2.9.1+rocm7.2.1-cp312-cp312-win_amd64.whl" }
torchvision = { path = "wheels/torchvision-0.24.1+rocm7.2.1-cp312-cp312-win_amd64.whl" }
"rocm-sdk-core" = { path = "wheels/rocm_sdk_core-7.2.1-py3-none-win_amd64.whl" }
"rocm-sdk-devel" = { path = "wheels/rocm_sdk_devel-7.2.1-py3-none-win_amd64.whl" }
"rocm-sdk-libraries-custom" = { path = "wheels/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl" }
rocm = { path = "wheels/rocm-7.2.1.tar.gz" }

[project.scripts]
chesslab = "chesslab.cli:main"

# uv-native dev dependencies (PEP 735). Installed by default on `uv sync`,
# excluded from the published package. Use `uv sync --no-dev` for a runtime-only env.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.15.20",
    "vulture>=2.16",
]

[tool.vulture]
# Dead-code detection: ruff's F-rules only see a single file (unused imports, unused locals);
# an exported function nobody calls is invisible to them. 80 is the threshold at which vulture
# stops guessing — below it, dynamic access (getattr, fixtures, plugin hooks) produces noise
# that trains people to ignore the tool.
#
# No whitelist on purpose. The only findings this repo had were pytest fixtures requested for
# their side effect and then unused as a parameter; those are now `@pytest.mark.usefixtures`,
# which says what they do instead of silencing what they look like.
min_confidence = 80
paths = ["src", "tests", "synth"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests/test_synth_degrade.py imports the Blender-side modules from synth/

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "synth"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ARG", "PERF"]
ignore = [
    "B904",   # raise-without-from-inside-except — noisy in existing code
    "E501",   # line-too-long — Formatter/Stil-Sache, kein Bug (405 Treffer)
    "E702",   # multiple-statements-semicolon — bewusster Kompakt-Stil im Repo
    # Beide 2026-08-20 probeweise scharfgeschaltet und wieder entfernt: ERA001 fand 6 Treffer,
    # alle Fehlalarme (Spaltenlegenden, Mathe-Notizen). ARG005 traf nur `lambda i: True`, wo der
    # AUFRUFER die Stelligkeit vorschreibt — dieselbe Begruendung wie fuer tests/ unten.
    "ERA001",
    "ARG005",
]

[tool.ruff.lint.per-file-ignores]
# Synth files import bpy (unresolved external) + Blender-Globals
"synth/**" = ["F403", "F405", "F821"]
# A fixture requested for its side effect (monkeypatch, a patched VideoCapture) has nothing to
# bind, and that is the point rather than an oversight.
"tests/**" = ["ARG001"]

[tool.ruff.format]
# Black-compatible line-ending style
quote-style = "double"
