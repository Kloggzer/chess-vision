[project]
name = "chesslab"
version = "0.2.0"
description = "Auto-labeled chess piece dataset builder (per-square 13-class classification)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "typer>=0.12",
    # Obergrenze, weil OpenCV 5 die Pixel verschiebt: gegen die Kotlin-Referenz gemessen
    # (2026-09-11) mittlere Abweichung 0,05-0,21 Graustufen, Maximum 4 — genau der
    # Vertrag, den `test_crop_pixel_parity` haelt. Ohne Deckel zieht ein frisches
    # `uv sync` die 5er und bricht ihn still.
    "opencv-python>=4.8,<5",
    "numpy>=1.24",
    "pillow>=10.0",
    "pymatting>=1.1",
    "python-chess>=1.10",
    "pyyaml>=6.0",
    # Windows-ROCm-Trainingsstack, aus AMDs whl-next-Index statt aus lokalen Wheels. Auf
    # Linux/macOS per Marker ausgeschlossen (Rig nutzt seine eigene ROCm-Umgebung).
    # Das `device-gfx1100`-Extra ist NICHT optional: die Kernel liegen im neuen Paketformat
    # getrennt, und ohne sie stirbt jeder Kernelstart mit `hipErrorInvalidImage`.
    # Jedes Unterpaket EINZELN: `[tool.uv.sources]` gilt nur fuer direkte Abhaengigkeiten,
    # transitive sucht uv auf PyPI und findet dort keine davon.
    "torch==2.13.0+rocm10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "torchvision==0.28.0+rocm10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "amd-torch-device-gfx1100==2.13.0+rocm10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm==10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-core==10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-devel==10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-libraries==10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "rocm-sdk-device-gfx1100==10.0.0 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    # Triton traegt `--compile-model` und `--compile-batch-aug`; ohne es sterben die Schalter.
    "triton-windows>=3.7,<3.8 ; sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'",
    "open3d>=0.19.0",
    "pymeshlab>=2025.7.post1",
    "trimesh>=4.12.2",
    "timm>=1.0.27",
    "pyturbojpeg>=2.4.0",
    "onnxruntime>=1.27.0",
    "onnxscript>=0.7.1",
    "simplejpeg>=1.9.0",
    # SAM 3 loads through it; before 2026-08-18 it was an undeclared `uv run --with` that the
    # export now cannot skip.
    "transformers>=4.57.0",
]
# Optional (lazy, with fallback): matplotlib (meshprep preview), pyperclip (UI clipboard)

[project.urls]
Repository = "https://github.com/Kloggzer/chess-vision"

[tool.uv]
# torchs Windows-Metadaten fordern `triton==3.8.0+git4cff872c.rocm10.0.0`, ein Paket, das es
# fuer Windows nicht gibt — das installierte Wheel selbst fuehrt die Anforderung nicht. Auf
# Windows liefert `triton-windows` das Modul unter demselben Importnamen.
override-dependencies = ["triton ; sys_platform == 'linux'"]

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
explicit = true

[tool.uv.sources]
torch = { index = "amd-rocm" }
torchvision = { index = "amd-rocm" }
rocm = { index = "amd-rocm" }
# Die Unterpakete brauchen eigene Eintraege: der Index ist `explicit`, greift also nur fuer
# das, was namentlich auf ihn zeigt — sonst sucht uv sie auf PyPI und findet nichts.
"rocm-bootstrap" = { index = "amd-rocm" }
"rocm-sdk-core" = { index = "amd-rocm" }
"rocm-sdk-devel" = { index = "amd-rocm" }
"rocm-sdk-libraries" = { index = "amd-rocm" }
"rocm-sdk-device-gfx1100" = { index = "amd-rocm" }
"amd-torch-device-gfx1100" = { index = "amd-rocm" }
"amd-torch-device-gfx110x" = { index = "amd-rocm" }

[project.scripts]
chesslab = "chesslab.cli:main"

# uv-native dev dependencies (PEP 735). Installed by default on `uv sync`,
# excluded from the published package. Use `uv sync --no-dev` for a runtime-only env.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.15.20",
    "vulture>=2.16",
]

[tool.vulture]
# Dead-code detection: ruff's F-rules only see a single file (unused imports, unused locals);
# an exported function nobody calls is invisible to them. 80 is the threshold at which vulture
# stops guessing — below it, dynamic access (getattr, fixtures, plugin hooks) produces noise
# that trains people to ignore the tool.
#
# No whitelist on purpose. The only findings this repo had were pytest fixtures requested for
# their side effect and then unused as a parameter; those are now `@pytest.mark.usefixtures`,
# which says what they do instead of silencing what they look like.
min_confidence = 80
paths = ["src", "tests", "synth"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests/test_synth_degrade.py imports the Blender-side modules from synth/

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "synth"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ARG", "PERF"]
ignore = [
    "B904",   # raise-without-from-inside-except — noisy in existing code
    "E501",   # line-too-long — Formatter/Stil-Sache, kein Bug (405 Treffer)
    "E702",   # multiple-statements-semicolon — bewusster Kompakt-Stil im Repo
    # Beide 2026-08-20 probeweise scharfgeschaltet und wieder entfernt: ERA001 fand 6 Treffer,
    # alle Fehlalarme (Spaltenlegenden, Mathe-Notizen). ARG005 traf nur `lambda i: True`, wo der
    # AUFRUFER die Stelligkeit vorschreibt — dieselbe Begruendung wie fuer tests/ unten.
    "ERA001",
    "ARG005",
]

[tool.ruff.lint.per-file-ignores]
# Synth files import bpy (unresolved external) + Blender-Globals
"synth/**" = ["F403", "F405", "F821"]
# A fixture requested for its side effect (monkeypatch, a patched VideoCapture) has nothing to
# bind, and that is the point rather than an oversight.
"tests/**" = ["ARG001"]

[tool.ruff.format]
# Black-compatible line-ending style
quote-style = "double"
