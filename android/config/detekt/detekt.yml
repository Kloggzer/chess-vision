build:
  weights:
    complexity: 2
    formatting: 1
    style: 1
    comments: 1
    exceptions: 1
    potential-bugs: 1
    performance: 1
    multi-rules: 1

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

comments:
  # `allRules` switches on detekt's mandatory-KDoc family. It is the exact inverse of this repo's
  # rule ("default is NO comment; a comment says why, never what"), so it would demand ~1.3k doc
  # blocks CLAUDE.md forbids. The two prose rules police wording, not correctness.
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  OutdatedDocumentation:
    active: false
  EndOfSentenceFormat:
    active: false
  KDocReferencesNonPublicProperty:
    active: false

complexity:
  # Compose screens legitimately take many parameters (state + event callbacks).
  #
  # The engine's thresholds were raised in the 17 "lean pass": the 6-parameter cap forced a family
  # of single-use holder classes (DetectContext, QuietContext, VetoResult, …) whose only purpose was
  # to get under it, and the 11-function cap fixed TrackerEngine's public surface at exactly what
  # fitted rather than at what the seam needs. A config that shapes the architecture is the wrong
  # config; 8 / 15 are the honest numbers for this code, recorded here instead of in @Suppress.
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInObjects: 15
    thresholdInInterfaces: 15
    thresholdInEnums: 15
    ignoreAnnotatedFunctions: ['Composable']
  # `allRules` extras. CyclomaticComplexMethod already caps method complexity at a tuned 15;
  # CognitiveComplexMethod is a second opinion on the same code at an untuned threshold.
  CognitiveComplexMethod:
    active: false
  # Labeled returns are how the engine leaves a nested scan loop; a seam interface may be wide.
  LabeledExpression:
    active: false
  ComplexInterface:
    active: false
  # Fires on repeated log keys and test fixtures - hoisting those into constants reads worse.
  StringLiteralDuplication:
    active: false

potential-bugs:
  # Android hands its own objects back after construction (onCreate, onViewCreated). lateinit is
  # the platform's shape there, not a smell.
  LateinitUsage:
    active: false

style:
  UnusedPrivateMember:
    active: true
  # Single-exit gymnastics (a `var out` threaded through four branches) is harder to read than
  # three honest returns; 2 was too tight for the engine's guard-then-compute shape.
  ReturnCount:
    max: 3
  UnusedParameter:
    active: true
  UnusedImports:
    active: true
  # Compose UI is literal-heavy (colours, dimensions, ranges); engine logic stays
  # strict - MagicNumber still fires for inline literals in non-Composable bodies.
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreAnnotated: ['Composable']
  # Align with ktlint's default line width (ktlintFormat collapses to 140).
  MaxLineLength:
    maxLineLength: 140
  # `allRules` extras, formatting half: ktlint is this repo's formatter of record and the source
  # already passes it. A second, differently opinionated formatter can only fight the first.
  MultilineRawStringIndentation:
    active: false
  TrimMultilineRawString:
    active: false
  CascadingCallWrapping:
    active: false
  BracesOnWhenStatements:
    active: false
  UnnecessaryParentheses:
    active: false
  ClassOrdering:
    active: false
  UnderscoresInNumericLiterals:
    active: false
  # `allRules` extras, idiom half: each prescribes one spelling of a construct that reads fine
  # both ways, and the data-class trio would rewrite value types the engine keeps deliberately plain.
  UseDataClass:
    active: false
  DataClassContainsFunctions:
    active: false
  DataClassShouldBeImmutable:
    active: false
  AlsoCouldBeApply:
    active: false
  UseLet:
    active: false
  UseIfInsteadOfWhen:
    active: false
  StringShouldBeRawString:
    active: false

naming:
  # Same reason as the ktlint `function-naming` exemption in `android/.editorconfig`: Compose
  # composables are PascalCase by convention, and detekt does not exempt them by default.
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  # Descriptive test and Compose names run past 30 chars; geometry legitimately has `of`, `x`, `y`.
  FunctionMaxLength:
    active: false
  FunctionMinLength:
    active: false
