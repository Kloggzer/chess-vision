build:
  weights:
    complexity: 2
    formatting: 1
    style: 1
    comments: 1
    exceptions: 1
    potential-bugs: 1
    performance: 1
    multi-rules: 1

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

complexity:
  # Compose screens legitimately take many parameters (state + event callbacks).
  LongParameterList:
    ignoreAnnotated: ['Composable']
  # TrackerService is the integration hub wiring engine + camera + geometry + settings.
  TooManyFunctions:
    # Bumped 17->18 for publishRawPreview (raw camera preview feature).
    # Bumped 19->22 for calibration-frame retention + stopTrackingToPreview (recalibrate flow).
    # Bumped 22->24 for the second-round ArUco/camera-decoding functions (baseline 1b4c2e0).
    thresholdInClasses: 24
    # ui/Components.kt is the shared themed-component library (spec 13-01): many small
    # single-purpose @Composable building blocks legitimately live in one file.
    thresholdInFiles: 20
  # HistoryScreen (deleted/replaced by the Games+Analysis screens in spec 13-06) and the
  # TrackingScreen rebuild (spec 13-02) legitimately exceed the defaults on the WIP baseline.
  LongMethod:
    threshold: 80
  CyclomaticComplexMethod:
    threshold: 20

style:
  UnusedPrivateMember:
    active: true
  UnusedParameter:
    active: true
  UnusedImports:
    active: true
  # Compose UI is literal-heavy (colours, dimensions, ranges); engine logic stays
  # strict â€” MagicNumber still fires for inline literals in non-Composable bodies.
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreAnnotated: ['Composable']
  # Align with ktlint's default line width (ktlintFormat collapses to 140).
  MaxLineLength:
    maxLineLength: 140
