build:
  weights:
    complexity: 2
    formatting: 1
    style: 1
    comments: 1
    exceptions: 1
    potential-bugs: 1
    performance: 1
    multi-rules: 1

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

complexity:
  # Compose screens legitimately take many parameters (state + event callbacks).
  LongParameterList:
    ignoreAnnotated: ['Composable']
  # TrackerService is the integration hub wiring engine + camera + geometry + settings.
  TooManyFunctions:
    thresholdInClasses: 17

style:
  UnusedPrivateMember:
    active: true
  UnusedParameter:
    active: true
  UnusedImports:
    active: true
  # Compose UI is literal-heavy (colours, dimensions, ranges); engine logic stays
  # strict — MagicNumber still fires for inline literals in non-Composable bodies.
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreAnnotated: ['Composable']
  # Align with ktlint's default line width (ktlintFormat collapses to 140).
  MaxLineLength:
    maxLineLength: 140
