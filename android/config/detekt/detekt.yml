build:
  weights:
    complexity: 2
    formatting: 1
    style: 1
    comments: 1
    exceptions: 1
    potential-bugs: 1
    performance: 1
    multi-rules: 1

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

complexity:
  # Compose screens legitimately take many parameters (state + event callbacks).
  LongParameterList:
    ignoreAnnotated: ['Composable']
  # Compose screens are declarative state renderers: long, branchy bodies are the
  # norm and extracting sub-composables is a design choice, not a complexity fix.
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  # TrackerService is the integration hub wiring engine + camera + geometry + settings.
  TooManyFunctions:
    # Bumped 17â†’18 for publishRawPreview (raw camera preview feature).
    # Bumped 19â†’22 for calibration-frame retention + stopTrackingToPreview (recalibrate flow).
    # Bumped 22->24 for the ArUco auto-calibration flow (integration base 1b4c2e0;
    # detekt thresholds are inclusive, so 23 functions needs 24).
    thresholdInClasses: 24

style:
  UnusedPrivateMember:
    active: true
    # Composables staged for a later wiring step (e.g. AlarmBanner, previews)
    # are legitimate; non-Compose code stays strict.
    ignoreAnnotated: ['Composable']
  UnusedParameter:
    active: true
  UnusedImports:
    active: true
  # Compose UI is literal-heavy (colours, dimensions, ranges); engine logic stays
  # strict â€” MagicNumber still fires for inline literals in non-Composable bodies.
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreAnnotated: ['Composable']
  # Align with ktlint's default line width (ktlintFormat collapses to 140).
  MaxLineLength:
    maxLineLength: 140
