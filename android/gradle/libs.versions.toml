[versions]
agp = "8.7.3"
kotlin = "2.1.10"
compose-bom = "2025.01.01"
camera = "1.4.1"
opencv = "4.10.0"
datastore = "1.1.2"
lifecycle = "2.8.7"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines = "1.9.0"
chesslib = "1.3.4"
ktor = "3.0.3"
zxing = "3.5.3"
# ONNX Runtime (MIT license, GPL-compatible). The Android AAR is the QNN build
# (bundles the Qualcomm QNN/Hexagon libs so the classifier can run on the NPU);
# JVM artifact for desktop unit tests (same ai.onnxruntime API). 1.21+ has addQnn().
onnxruntime = "1.21.1"
junit-jupiter = "5.12.0"
junit-platform = "1.12.0"
activity-compose = "1.9.3"
navigation = "2.8.5"
ktlint = "12.2.0"
detekt = "1.23.8"
# Host-only natives for the desktop-JVM geometry tests (JavaCV wraps OpenCV/FFmpeg
# so :core-geometry unit tests can decode the shared Blender clips and warp frames
# without an emulator). Classified artifacts are pulled via `variantOf { classifier(...) }`.
javacv = "1.5.11"
bytedeco-opencv = "4.10.0-1.5.11"
bytedeco-ffmpeg = "7.1-1.5.11"
bytedeco-openblas = "0.3.28-1.5.11"
snakeyaml = "2.3"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
# Not wired into any module: the extended icon set cost a measured 31.2 MB of dex and no
# source file imports androidx.compose.material.icons. Kept as a ready alias — declare
# it in the module that first uses an `Icons.*` symbol, not before.
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
opencv = { group = "org.opencv", name = "opencv", version.ref = "opencv" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
chesslib = { group = "com.github.bhlangonijr", name = "chesslib", version.ref = "chesslib" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
onnxruntime-android-qnn = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android-qnn", version.ref = "onnxruntime" }
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
javacv = { group = "org.bytedeco", name = "javacv", version.ref = "javacv" }
bytedeco-opencv = { group = "org.bytedeco", name = "opencv", version.ref = "bytedeco-opencv" }
bytedeco-ffmpeg = { group = "org.bytedeco", name = "ffmpeg", version.ref = "bytedeco-ffmpeg" }
bytedeco-openblas = { group = "org.bytedeco", name = "openblas", version.ref = "bytedeco-openblas" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
